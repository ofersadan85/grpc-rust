[workspace]
members = ["client","common", "server"]
resolver = "3"

[workspace.lints.rust]
# unsafe_code = "forbid"
# dead_code = "allow"

[workspace.lints.clippy]
# cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unwrap_used = "deny"

[workspace.dependencies]
common = { path = "common" }
server = { path = "server" }

clap = { version = "4.5.53", features = ["derive"] }
color-eyre = "0.6.5"
http = "1.4.0"
prost = "0.14.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tower = "0.5.2"
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.22", features = ["chrono", "env-filter"] }
uuid = { version = "1.19.0", features = ["v7", "fast-rng"] }
